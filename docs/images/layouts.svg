<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 372" width="740" height="372" font-family="Segoe UI, system-ui, sans-serif">
  <!-- The layouts pane-pogo can make. Teal = current window, light teal = previous window. -->
  <defs>
    <g id="mon"><rect width="140" height="84" rx="6" fill="#111827"/><rect x="5" y="5" width="130" height="70" fill="#e5e7eb"/></g>
    <g id="mini"><rect width="66" height="50" rx="5" fill="#111827"/><rect x="4" y="4" width="58" height="40" fill="#e5e7eb"/></g>
  </defs>
  <rect width="740" height="372" rx="14" fill="#ffffff"/>
  <g font-size="13" fill="#111827" text-anchor="middle" stroke-linejoin="round">

    <!-- Row 1: two windows -->
    <text x="370" y="26" font-size="14" font-weight="600">Two windows: the one you're in, and the one you used just before</text>

    <g transform="translate(20,40)">
      <use href="#mon"/>
      <rect x="5" y="5" width="65" height="70" fill="#99f6e4" stroke="#fff" stroke-width="1.5"/>
      <rect x="70" y="5" width="65" height="70" fill="#2dd4bf" stroke="#fff" stroke-width="1.5"/>
      <text x="70" y="106">Side by side ½ + ½</text>
    </g>
    <g transform="translate(200,40)">
      <use href="#mon"/>
      <rect x="5" y="5" width="87" height="70" fill="#2dd4bf" stroke="#fff" stroke-width="1.5"/>
      <rect x="92" y="5" width="43" height="70" fill="#99f6e4" stroke="#fff" stroke-width="1.5"/>
      <text x="70" y="106">2/3 + 1/3, or 1/3 + 2/3</text>
    </g>
    <g transform="translate(380,40)">
      <use href="#mini" y="17"/>
      <rect x="4" y="21" width="58" height="40" fill="#99f6e4"/>
      <use href="#mini" x="74" y="17"/>
      <rect x="78" y="21" width="58" height="40" fill="#2dd4bf"/>
      <text x="70" y="106">Full screen, one per monitor</text>
    </g>
    <g transform="translate(560,40)">
      <use href="#mon"/>
      <rect x="5" y="5" width="65" height="70" fill="#2dd4bf" stroke="#fff" stroke-width="1.5"/>
      <rect x="70" y="5" width="65" height="70" fill="#99f6e4" stroke="#fff" stroke-width="1.5"/>
      <path d="M52 34 h36 m-6 -5 l6 5 l-6 5 M88 48 h-36 m6 -5 l-6 5 l6 5" fill="none" stroke="#042f2e" stroke-width="2" stroke-linecap="round"/>
      <text x="70" y="106">Swap places</text>
    </g>

    <!-- Row 2: one window -->
    <text x="370" y="196" font-size="14" font-weight="600">One window: the one you're in</text>

    <g transform="translate(110,210)">
      <use href="#mon"/>
      <rect x="5" y="5" width="130" height="70" fill="#2dd4bf"/>
      <text x="70" y="106">Full screen on a monitor</text>
    </g>
    <g transform="translate(300,210)">
      <use href="#mon"/>
      <rect x="5" y="5" width="65" height="70" fill="#2dd4bf"/>
      <text x="70" y="106">Left or right half</text>
    </g>
    <g transform="translate(490,210)">
      <use href="#mini" y="17"/>
      <rect x="12" y="28" width="36" height="24" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="3 2"/>
      <use href="#mini" x="74" y="17"/>
      <rect x="86" y="28" width="36" height="24" fill="#2dd4bf"/>
      <path d="M50 40 h32 m-6 -5 l6 5 l-6 5" fill="none" stroke="#042f2e" stroke-width="2" stroke-linecap="round"/>
      <text x="70" y="106">Move to next monitor</text>
    </g>
    <g transform="translate(250,346)" text-anchor="start" font-size="12" fill="#4b5563">
      <rect width="14" height="14" rx="2" fill="#2dd4bf"/><text x="20" y="11">Current window</text>
      <rect x="130" width="14" height="14" rx="2" fill="#99f6e4"/><text x="150" y="11">Previous window</text>
    </g>
  </g>
</svg>
