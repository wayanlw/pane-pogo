[package]
name = "pane-pogo"
version = "0.1.0"
edition = "2024"
description = "Windows tray app: one key brings your other app next to you, another makes you full screen again."
license = "MIT"
repository = "https://github.com/wayanlw/pane-pogo"
readme = "README.md"

[dependencies]
eframe = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
